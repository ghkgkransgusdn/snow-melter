function computeSnowMelterProgress(data) {
    let total = 0, filled = 0;
    const visit = (obj) => {
        if (obj == null)
            return;
        if (typeof obj === 'string') {
            total++;
            if (obj.trim().length > 0)
                filled++;
        }
        else if (Array.isArray(obj)) {
            obj.forEach(visit);
        }
        else if (typeof obj === 'object') {
            for (const k in obj)
                visit(obj[k]);
        }
    };
    visit(data);
    return total === 0 ? 0 : Math.round(filled / total * 100);
}

function ProjectListScreen({ user, isAdminUser, onPickProject, onAdminLogin, onSignOut }) {
    const [userProjects, setUserProjects] = useState(null);
    const [err, setErr] = useState('');
    const [creating, setCreating] = useState(false);

    const reload = useCallback(async () => {
        try { setUserProjects(await listUserProjects()); }
        catch (e) { setErr(e.message); setUserProjects([]); }
    }, []);
    useEffect(() => { reload(); }, [reload]);

    const allProjects = useMemo(() => {
        const builtins = Object.entries(TEMPLATES)
            .filter(([id, t]) => t.builtin)
            .map(([id, t]) => ({
                id, name: t.label, category: t.category,
                templateId: id, builtin: true,
                dataRoot: t.dataRootFor(id),
            }));
        const userOnes = (userProjects || []).map(p => {
            const tpl = TEMPLATES[p.templateId] || TEMPLATES.basic;
            return {
                id: p.id, name: p.name, category: p.category,
                templateId: p.templateId, builtin: false,
                dataRoot: tpl.dataRootFor(p.id),
                createdAt: p.createdAt,
            };
        });
        return [...builtins, ...userOnes];
    }, [userProjects]);

    const byCategory = useMemo(() => {
        const m = new Map();
        for (const p of allProjects) {
            if (!m.has(p.category)) m.set(p.category, []);
            m.get(p.category).push(p);
        }
        return Array.from(m.entries());
    }, [allProjects]);

    const handleCreate = async ({ name, templateId, category }) => {
        try {
            await createUserProject(name, templateId, category);
            setCreating(false);
            await reload();
        } catch (e) { alert('프로젝트 생성 실패: ' + e.message); }
    };
    const handleRename = async (p) => {
        if (p.builtin) return;
        const newName = prompt('새 프로젝트 이름:', p.name);
        if (newName && newName !== p.name) {
            try { await renameUserProject(p.id, newName); await reload(); }
            catch (e) { alert('이름 변경 실패: ' + e.message); }
        }
    };
    const handleDelete = async (p) => {
        if (p.builtin) { alert('기본 제공 프로젝트는 삭제할 수 없습니다.'); return; }
        if (!confirm(`'${p.name}' 프로젝트를 삭제하시겠습니까? 모든 반·모둠·자료가 영구 삭제됩니다.`)) return;
        try { await deleteUserProject(p.id); await reload(); }
        catch (e) { alert('삭제 실패: ' + e.message); }
    };

    const [migrating, setMigrating] = useState(false);
    const handleMigrate = async () => {
        if (!isAdminUser) { alert('관리자로 로그인한 뒤 실행하세요.'); return; }
        if (!confirm('기존 자료를 새로운 안전한 구조로 옮깁니다.\n\n· 작성 내용·비밀번호는 새 위치로 복사된 뒤, 옛 위치에서는 정리되어 다른 모둠이 볼 수 없게 됩니다.\n· 자료가 사라지지는 않습니다(복사 성공 후에만 옛 위치 정리).\n· 여러 번 실행해도 안전합니다.\n\n계속할까요?')) return;
        setMigrating(true);
        try {
            const pairs = allProjects.map(migrationPairFor);
            const summary = await migrateToSecureLayout(pairs);
            let msg = `마이그레이션 완료!\n\n· 반: ${summary.classes}개\n· 모둠: ${summary.groups}개\n· 작성된 자료: ${summary.withData}개\n· 비밀번호 모둠: ${summary.withPassword}개`;
            if (summary.failures && summary.failures.length) {
                msg += `\n\n⚠ 일부 실패(${summary.failures.length}건):\n` + summary.failures.slice(0, 5).join('\n');
            } else {
                msg += '\n\n이제 비밀번호 보호가 정상 작동합니다. 시크릿 창에서 테스트해 보세요.';
            }
            alert(msg);
            await reload();
        } catch (e) {
            alert('마이그레이션 오류: ' + (e && e.message ? e.message : String(e)));
        } finally {
            setMigrating(false);
        }
    };

    return React.createElement('div', null,
        React.createElement(UserBar, { user, isAdminUser, onAdminLogin, onSignOut }),
        React.createElement('div', { className: 'screen-container' },
            React.createElement('div', { className: 'screen-title' }, '보고서 작성 앱'),
            React.createElement('div', { className: 'screen-subtitle' }, '진행할 프로젝트를 선택하세요.'),

            isAdminUser && React.createElement('div', { className: 'toolbar-row' },
                React.createElement('button', { className: 'btn', onClick: () => setCreating(true) }, '+ 새 프로젝트 만들기'),
                React.createElement('button', { className: 'btn btn-secondary', onClick: handleMigrate, disabled: migrating, title: '기존 자료를 비밀번호 보호가 작동하는 새 구조로 복사합니다 (1회 실행)' },
                    migrating ? '변환 중...' : '🔐 자료 구조 업데이트(1회)')),

            err && React.createElement('div', { className: 'err-msg' }, err),

            userProjects === null ? React.createElement('div', { className: 'empty-state' }, '불러오는 중...') :
                byCategory.map(([category, projects]) => React.createElement('div', { key: category, style: { marginBottom: 24 } },
                    React.createElement('div', {
                        style: {
                            fontSize: 13, color: '#6b7280', fontWeight: 700,
                            margin: '20px 0 8px', textTransform: 'uppercase',
                            letterSpacing: '0.05em'
                        }
                    }, category),
                    projects.map(p => React.createElement('div', { key: p.id, className: 'list-card', onClick: () => onPickProject(p) },
                        React.createElement('span', { className: 'icon' }, p.builtin ? '🌟' : '📝'),
                        React.createElement('div', { className: 'body' },
                            React.createElement('div', { className: 'title' }, p.name),
                            React.createElement('div', { className: 'meta' }, '템플릿: ', (TEMPLATES[p.templateId] || {}).label || p.templateId)),
                        isAdminUser && !p.builtin && React.createElement('div', { className: 'actions', onClick: (e) => e.stopPropagation() },
                            React.createElement('button', { className: 'btn btn-secondary', onClick: () => handleRename(p) }, '이름변경'),
                            React.createElement('button', { className: 'btn btn-danger', onClick: () => handleDelete(p) }, '삭제'))
                    ))
                ))
        ),

        creating && React.createElement(CreateProjectModal, {
            onClose: () => setCreating(false),
            onCreate: handleCreate,
        })
    );
}

function CreateProjectModal({ onClose, onCreate }) {
    const [name, setName] = useState('');
    const choices = Object.entries(TEMPLATES).filter(([id, t]) => !t.builtin);
    const defaultId = choices.length ? choices[0][0] : 'basic';
    const [templateId, setTemplateId] = useState(defaultId);
    const defaultCat = TEMPLATES[defaultId]?.category || '과학 실험보고서';
    const [category, setCategory] = useState(defaultCat);

    // When template changes, update category default (only if the user hasn't customized it)
    const lastAutoCat = useRef(defaultCat);
    useEffect(() => {
        const tplCat = TEMPLATES[templateId]?.category || '';
        if (category === lastAutoCat.current) {
            setCategory(tplCat);
            lastAutoCat.current = tplCat;
        }
    }, [templateId]);

    const tpl = TEMPLATES[templateId] || {};
    const submit = () => {
        if (!name.trim()) return;
        onCreate({ name: name.trim(), templateId, category: category.trim() || (TEMPLATES[templateId]?.category || '과학 실험보고서') });
    };

    return React.createElement(Modal, { title: '새 프로젝트 만들기', onClose, onConfirm: submit, confirmDisabled: !name.trim() },
        React.createElement('div', { className: 'form-group' },
            React.createElement('label', null, '프로젝트 이름'),
            React.createElement('input', { type: 'text', value: name, onChange: e => setName(e.target.value), placeholder: '예: 물의 표면장력 실험', autoFocus: true })),

                style: { width: '100%', padding: '10px 12px', border: '1px solid #d1d5db', borderRadius: 6, fontSize: 14, background: 'white' }

                choices.map(([id, t]) => React.createElement('option', { key: id, value: id }, t.label))),

    );

// COLLABORATIVE WORKSHEET APP (replaces original App for groups)
// =====================================================================
function CollabApp({ user, isAdminUser, project, klass, group, onExit }) {
    const template = TEMPLATES[project.templateId] || TEMPLATES.snow_melter;
    const sections = template.sections;
    const dataRoot = project.dataRoot;
    const [data, setData] = useState(template.EMPTY_DATA);
    const [section, setSection] = useState(sections[0].id);
    const [syncState, setSyncState] = useState('connecting');
    const [downloading, setDownloading] = useState(false);
    const [downloadMsg, setDownloadMsg] = useState('');
    const [presence, setPresence] = useState({});
    const [showPwSet, setShowPwSet] = useState(false);
    const [hasPassword, setHasPassword] = useState(null);

    const pendingWrites = useRef(new Map());   // pathStr -> { value, ts, confirmed }
    const writeTimers = useRef(new Map());      // pathStr -> debounce timer
    const retryTimer = useRef(null);
    const localDataRef = useRef(template.EMPTY_DATA);
    const focusedFieldRef = useRef(null);
    const connectedRef = useRef(true);

    // Flush (or re-flush) every unconfirmed pending write to the server.
    // Used on reconnect and as a periodic safety retry, so nothing is lost.
    const flushPending = useCallback(async () => {
        if (pendingWrites.current.size === 0) return;
        const entries = Array.from(pendingWrites.current.entries());
        for (const [pathStr, entry] of entries) {
            if (entry.confirmed) continue;
            const pathArr = pathStr.split('/').map(p => {
                const n = parseInt(p, 10);
                return (isNaN(n) || String(n) !== p) ? p : n;
            });
            try {
                await writeGroupDataPath(dataRoot, klass.id, group.id, pathArr, entry.value);
                // mark confirmed; it will be cleared when the server echo matches
                const cur = pendingWrites.current.get(pathStr);
                if (cur && cur.value === entry.value) cur.confirmed = true;
            } catch (e) {
                // leave it pending; will retry again later
                console.warn('flush retry failed:', pathStr, e && e.message);
            }
        }
    }, [dataRoot, klass.id, group.id]);

    // Data subscription
    useEffect(() => {
        let unsub;
        (async () => {
            try {
                const fb = await initFirebase();
                try {
                    const metaSnap = await fb.get(fb.ref(fb.db, metaGroupPath(dataRoot, klass.id, group.id)));
                    setHasPassword(!!(metaSnap.exists() && metaSnap.val() && metaSnap.val().hasPassword));
                } catch (e) { setHasPassword(null); }
                unsub = await subscribeToGroupData(dataRoot, klass.id, group.id, (val) => {
                    let merged = deepMerge(template.EMPTY_DATA, val || {});
                    // Re-apply every pending local write on top of the incoming snapshot.
                    // IMPORTANT: pending writes are kept until the server echoes the SAME
                    // value back (confirmed), so a slow/stale snapshot can never wipe out
                    // what the student just typed. There is no time-based expiry.
                    pendingWrites.current.forEach((entry, pathStr) => {
                        const pathArr = pathStr.split('/').map(p => {
                            const n = parseInt(p, 10);
                            return (isNaN(n) || String(n) !== p) ? p : n;
                        });
                        // Read the value the snapshot has for this path
                        let snapVal = merged;
                        for (const seg of pathArr) { snapVal = (snapVal == null) ? undefined : snapVal[seg]; }
                        if (entry.confirmed && JSON.stringify(snapVal) === JSON.stringify(entry.value)) {
                            // Server now agrees with our write — safe to drop it.
                            pendingWrites.current.delete(pathStr);
                        } else {
                            // Keep our local value visible.
                            merged = update(merged, pathArr, entry.value);
                        }
                    });
                    localDataRef.current = merged;
                    setData(merged);
                    if (connectedRef.current) setSyncState('synced');
                }, (err) => {
                    // A read error (e.g. transient permission/network) must NOT wipe the
                    // student's current work. Just surface the status; keep local data.
                    if (!connectedRef.current) setSyncState('offline');
                    else setSyncState('error');
                });
            } catch (e) {
                console.error('Subscription failed:', e);
                setSyncState('error');
            }
        })();
        return () => { if (unsub) unsub(); };
    }, [dataRoot, klass.id, group.id]);

    // Connection-state tracking: drives the status indicator + triggers a flush on reconnect.
    useEffect(() => {
        let unsub;
        (async () => {
            try {
                unsub = await subscribeConnectionState((connected) => {
                    connectedRef.current = connected;
                    if (connected) {
                        setSyncState('synced');
                        flushPending(); // resend anything that didn't make it
                    } else {
                        setSyncState('offline');
                    }
                });
            } catch (e) { /* ignore */ }
        })();
        return () => { if (unsub) unsub(); };
    }, [flushPending]);

    // Periodic safety retry: every 8s, re-send any still-unconfirmed writes.
    useEffect(() => {
        retryTimer.current = setInterval(() => {
            if (connectedRef.current) flushPending();
        }, 8000);
        return () => { if (retryTimer.current) clearInterval(retryTimer.current); };
    }, [flushPending]);

    // Warn the student if they try to leave with unsaved (unconfirmed) edits.
    useEffect(() => {
        const handler = (e) => {
            const hasUnconfirmed = Array.from(pendingWrites.current.values()).some(en => !en.confirmed);
            if (hasUnconfirmed) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            }
        };
        window.addEventListener('beforeunload', handler);
        return () => window.removeEventListener('beforeunload', handler);
    }, []);

    useEffect(() => {
        let unsub;
        (async () => {
            try { unsub = await subscribePresence(dataRoot, klass.id, group.id, setPresence); }
            catch (e) { /* optional */ }
        })();
        return () => { if (unsub) unsub(); };
    }, [dataRoot, klass.id, group.id]);

    const set = useCallback((path, value) => {
        setData(d => {
            const newData = update(d, path, value);
            localDataRef.current = newData;
            return newData;
        });
        const pathStr = path.join('/');
        // Mark as pending & unconfirmed. Stays until server echoes the same value.
        pendingWrites.current.set(pathStr, { value, ts: Date.now(), confirmed: false });
        const existing = writeTimers.current.get(pathStr);
        if (existing) clearTimeout(existing);
        const timer = setTimeout(async () => {
            writeTimers.current.delete(pathStr);
            try {
                await writeGroupDataPath(dataRoot, klass.id, group.id, path, value);
                const cur = pendingWrites.current.get(pathStr);
                if (cur && cur.value === value) cur.confirmed = true; // wait for echo to delete
                if (connectedRef.current) setSyncState('synced');
            } catch (e) {
                // Keep it pending (unconfirmed); the reconnect/periodic flush will retry.
                console.warn('Write failed, will retry:', pathStr, e && e.message);
                if (!connectedRef.current) setSyncState('offline');
            }
        }, 350);
        writeTimers.current.set(pathStr, timer);
    }, [dataRoot, klass.id, group.id]);

    const progress = useMemo(() => template.computeProgress(data), [data, template]);

    const handleDownload = async () => {
        setDownloading(true);
        setDownloadMsg('DOCX 라이브러리 확인 중...');
        const docxLib = await ensureDocxLib();
        if (!docxLib) {
            alert('DOCX 라이브러리를 불러오지 못했습니다.');
            setDownloading(false); return;
        }
        let chartImgs = {};
        if (template.hasCharts) {
            setDownloadMsg('차트 이미지 생성 중...');
            refreshAllCharts();
            await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
            const canvases = Array.from(document.querySelectorAll('.chart-box canvas'));
            canvases.forEach((cv, i) => {
                try {
                    const url = cv.toDataURL('image/png');
                    if (i === 0) chartImgs.cooling = url;
                    else if (i === 1) chartImgs.melting = url;
                    else if (i === 2) chartImgs.radar = url;
                } catch (e) { }
            });
        }
        try {
            setDownloadMsg('문서 생성 중...');
            const blob = await template.buildDoc(data, chartImgs, project.name);
            const saveAs = resolveSaveAs();
            const projectSafe = safeFilename(project.name || 'report');
            const groupSafe = safeFilename(group.name || 'group');
            const classSafe = safeFilename(klass.name || 'class');
            const fname = `${projectSafe}_${classSafe}_${groupSafe}.docx`;
            if (saveAs) saveAs(blob, fname); else downloadBlob(blob, fname);
            setDownloadMsg('완료');
            setTimeout(() => { setDownloading(false); setDownloadMsg(''); }, 800);
        } catch (e) {
            console.error(e);
            alert('문서 생성 실패: ' + (e.message || e));
            setDownloading(false); setDownloadMsg('');
        }
    };

    useEffect(() => {
        const handleFocus = (e) => {
            const el = e.target;
            if ((el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && el.classList.contains('cell')) {
                const id = el.id || el.name || el.placeholder || '';
                focusedFieldRef.current = id;
                publishPresence(dataRoot, klass.id, group.id, id).catch(() => { });
            }
        };
        const handleBlur = () => {
            focusedFieldRef.current = null;
            publishPresence(dataRoot, klass.id, group.id, null).catch(() => { });
        };
        document.addEventListener('focusin', handleFocus);
        document.addEventListener('focusout', handleBlur);
        return () => {
            document.removeEventListener('focusin', handleFocus);
            document.removeEventListener('focusout', handleBlur);
            publishPresence(dataRoot, klass.id, group.id, null).catch(() => { });
        };
    }, [dataRoot, klass.id, group.id]);

    const currentIdx = sections.findIndex(s => s.id === section);
    const myUid = user?.uid;
    const otherPresenceCount = Object.keys(presence || {}).filter(uid => uid !== myUid).length;

    return React.createElement(React.Fragment, null,
        React.createElement('div', { className: 'topbar' },
            React.createElement('button', { className: 'btn btn-secondary', onClick: onExit, style: { marginRight: 8 } }, '← 모둠 목록'),
            React.createElement('h1', null,
                klass.name, ' / ', group.name,
                isAdminUser && React.createElement('span', { className: 'admin-badge' }, '관리자')
            ),
            React.createElement('span', { className: 'save-status ' + (syncState === 'synced' ? 'saved' : (syncState === 'offline' || syncState === 'error' ? 'offline' : '')) },
                syncState === 'connecting' ? '연결 중...' :
                    syncState === 'synced' ? `✓ 실시간 저장 중${otherPresenceCount > 0 ? ` · 함께 작성 ${otherPresenceCount}명` : ''}` :
                        syncState === 'offline' ? '⚠ 인터넷 끊김 — 입력 내용은 보관되며 연결되면 자동 저장됩니다' :
                            '⚠ 연결 오류 — 입력 내용은 보관되며 재연결 시 저장됩니다'),
            (hasPassword === false || isAdminUser) && React.createElement('button', { className: 'btn btn-secondary', onClick: () => setShowPwSet(true) },
                hasPassword ? '🔒 비밀번호 변경' : '🔒 비밀번호 설정'),
            React.createElement('button', { className: 'btn', onClick: handleDownload, disabled: downloading },
                downloading ? '생성 중...' : '📥 docx 다운로드')
        ),
        React.createElement('div', { className: 'nav' },
            sections.map(s =>
                React.createElement('button', { key: s.id, className: section === s.id ? 'active' : '', onClick: () => { setSection(s.id); window.scrollTo(0, 0); } }, s.label))
        ),
        React.createElement('div', { className: 'container' },
            React.createElement('div', { style: { marginBottom: '20px' } },
                React.createElement('div', { style: { fontSize: '13px', color: '#6b7280', marginBottom: '4px' } }, '작성 진행률: ', progress, '%'),
                React.createElement('div', { className: 'progress-bar' }, React.createElement('div', { style: { width: progress + '%' } }))),
            sections.map(s => {
                const Comp = s.comp;
                const isActive = section === s.id;
                return React.createElement('div', {
                    key: s.id,
                    style: isActive ? {} : { position: 'absolute', left: '-99999px', top: 0, width: '900px', pointerEvents: 'none' },
                    'aria-hidden': !isActive,
                    ...(isActive ? {} : { inert: '' })
                },
                    React.createElement(Comp, { data, set })
                );
            }),
            React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: '40px', paddingTop: '20px', borderTop: '1px solid #e5e7eb' } },
                currentIdx > 0 ? React.createElement('button', { className: 'btn btn-secondary', onClick: () => { setSection(sections[currentIdx - 1].id); window.scrollTo(0, 0); } }, '← ', sections[currentIdx - 1].label) : React.createElement('div'),
                currentIdx < sections.length - 1 ?
                    React.createElement('button', { className: 'btn', onClick: () => { setSection(sections[currentIdx + 1].id); window.scrollTo(0, 0); } }, sections[currentIdx + 1].label, ' →') :
                    React.createElement('button', { className: 'btn', onClick: handleDownload, disabled: downloading, style: { fontSize: '15px' } }, '📥 완성 — docx 다운로드'))
        ),
        downloading && React.createElement('div', { className: 'overlay' },
            React.createElement('div', { className: 'overlay-box' },
                React.createElement('div', { className: 'spinner' }),
                React.createElement('div', { style: { fontWeight: '600', marginBottom: '4px' } }, '문서 생성 중'),
                React.createElement('div', { style: { fontSize: '13px', color: '#6b7280' } }, downloadMsg))),
        showPwSet && React.createElement(StudentPasswordSetModal, {
            dataRoot, classId: klass.id, groupId: group.id,

// =====================================================================
// ADMIN BULK DOWNLOAD — generates docx for any group's current data
// =====================================================================
async function adminDownloadGroupDocx(project, klass, group) {
    const template = TEMPLATES[project.templateId] || TEMPLATES.snow_melter;
    const docxLib = await ensureDocxLib();
    if (!docxLib) { alert('DOCX 라이브러리를 불러오지 못했습니다.'); return; }
    const raw = (await loadGroupDataOnce(project.dataRoot, klass.id, group.id)) || template.EMPTY_DATA;
    const merged = deepMerge(template.EMPTY_DATA, raw);
    // Note: charts only render when the group's UI is in DOM. Admin bulk download has no charts.
    const blob = await template.buildDoc(merged, {}, project.name);
    const saveAs = resolveSaveAs();
    const fname = `${safeFilename(project.name)}_${safeFilename(klass.name)}_${safeFilename(group.name)}.docx`;
    if (saveAs) saveAs(blob, fname); else downloadBlob(blob, fname);
}

// TOP-LEVEL ROUTER
// =====================================================================
function TopApp() {
    // route: { screen: 'projectList' | 'classList' | 'groupList' | 'passwordPrompt' | 'worksheet', project?, klass?, group? }
    const [route, setRoute] = useState({ screen: 'projectList' });
    const [user, setUser] = useState(null);
    const [isAdminUser, setIsAdminUser] = useState(false);
    const [authReady, setAuthReady] = useState(false);
    const [authError, setAuthError] = useState('');
    const [showAdminLogin, setShowAdminLogin] = useState(false);

    // Initialize auth on mount
    useEffect(() => {
        (async () => {
            try {
                const fb = await initFirebase();
                fb.onAuthStateChanged(fb.auth, async (u) => {
                    if (u) {
                        setUser(u);
                        const admin = await isAdmin(u.uid);
                        setIsAdminUser(admin);
                        setAuthReady(true);
                    } else {
                        // Sign in anonymously
                        try { await fb.signInAnonymously(fb.auth); }
                        catch (e) { setAuthError(e.message); setAuthReady(true); }
                    }
                });
            } catch (e) {
                setAuthError(e.message);
                setAuthReady(true);
            }
        })();
    }, []);

    const handleAdminLoginSuccess = async () => {
        // onAuthStateChanged will update user/isAdmin
        setShowAdminLogin(false);
        // Force re-evaluation
        const fb = await initFirebase();
        const u = fb.auth.currentUser;
        if (u) {
            setUser(u);
            setIsAdminUser(await isAdmin(u.uid));
        }
    };

    const handleSignOut = async () => {
        try {
            await signOutAndRefresh();
            // onAuthStateChanged will fire with anonymous user
            setIsAdminUser(false);
            setRoute({ screen: 'projectList' });
        } catch (e) { alert('로그아웃 실패: ' + e.message); }
    };

    if (!authReady) {
        return React.createElement('div', { style: { padding: 60, textAlign: 'center', color: '#64748b' } },
            React.createElement('div', { className: 'spinner', style: { margin: '0 auto 16px' } }),
            'Firebase 연결 중...');
    }
    if (authError) {
        return React.createElement('div', { style: { maxWidth: 600, margin: '60px auto', padding: 28, background: '#fef2f2', border: '1px solid #fecaca', borderRadius: 12 } },
            React.createElement('h2', { style: { color: '#b91c1c', marginTop: 0 } }, 'Firebase 연결 실패'),
            React.createElement('p', null, '아래 사항을 확인하세요:'),
            React.createElement('ul', null,
                React.createElement('li', null, '파일 상단의 ', React.createElement('code', null, 'FIREBASE_CONFIG'), '에 올바른 값이 들어있는지'),
                React.createElement('li', null, 'Firebase 콘솔에서 Realtime Database가 활성화되어 있는지'),
                React.createElement('li', null, 'Authentication에서 익명/이메일 로그인이 활성화되어 있는지'),
                React.createElement('li', null, 'Database 보안 규칙이 설정되어 있는지'),
                React.createElement('li', null, '인터넷 연결 / 학교 네트워크의 firebase 도메인 차단 여부')),
            React.createElement('pre', { style: { background: '#fff', padding: 12, borderRadius: 6, fontSize: 12, color: '#7f1d1d' } }, authError));
    }

    return React.createElement(React.Fragment, null,
        route.screen === 'projectList' && React.createElement(ProjectListScreen, {
            user, isAdminUser,
            onPickProject: (project) => setRoute({ screen: 'classList', project }),
            onAdminLogin: () => setShowAdminLogin(true),
            onSignOut: handleSignOut
        }),

        route.screen === 'classList' && React.createElement(ClassListScreen, {
            user, isAdminUser, project: route.project,
            onBack: () => setRoute({ screen: 'projectList' }),
            onPickClass: (klass) => setRoute({ screen: 'groupList', project: route.project, klass }),
            onAdminLogin: () => setShowAdminLogin(true),
            onSignOut: handleSignOut
        }),

        route.screen === 'groupList' && React.createElement(GroupListScreen, {
            user, isAdminUser, project: route.project, klass: route.klass,
            onBack: () => setRoute({ screen: 'classList', project: route.project }),
            onPickGroup: async (group) => {
                const access = await checkGroupAccess(route.project.dataRoot, route.klass.id, group.id, isAdminUser);
                if (access === 'admin' || access === 'unlocked') {
                    setRoute({ screen: 'worksheet', project: route.project, klass: route.klass, group });
                } else {
                    setRoute({ screen: 'passwordPrompt', project: route.project, klass: route.klass, group });
                }
            },
            onAdminLogin: () => setShowAdminLogin(true),
            onSignOut: handleSignOut
        }),

        route.screen === 'passwordPrompt' && React.createElement(PasswordPromptScreen, {
            project: route.project, klass: route.klass, group: route.group,
            onBack: () => setRoute({ screen: 'groupList', project: route.project, klass: route.klass }),
            onUnlock: () => setRoute({ screen: 'worksheet', project: route.project, klass: route.klass, group: route.group })
        }),

        route.screen === 'worksheet' && React.createElement(CollabApp, {
            user, isAdminUser, project: route.project, klass: route.klass, group: route.group,
            onExit: () => setRoute({ screen: 'groupList', project: route.project, klass: route.klass })
        }),

        showAdminLogin && React.createElement(AdminLoginModal, {
            onClose: () => setShowAdminLogin(false),
            onSuccess: handleAdminLoginSuccess
        })
    );
}


class ErrorBoundary extends React.Component {
    constructor(props) {
        super(props);
        this.state = { error: null };
    }
    static getDerivedStateFromError(error) {
        return { error };
    }
    componentDidCatch(error, info) {
        console.error('앱 렌더링 오류:', error, info);
    }
    render() {
        if (this.state.error) {
            return (React.createElement("div", { style: { maxWidth: '760px', margin: '60px auto', padding: '28px', background: '#fff', border: '1px solid #fecaca', borderRadius: '12px', fontFamily: 'Malgun Gothic, sans-serif', boxShadow: '0 8px 24px rgba(0,0,0,0.08)' } },
                React.createElement("h2", { style: { marginTop: 0, color: '#b91c1c' } }, "\uC6F9\uC571 \uC2E4\uD589 \uC911 \uC624\uB958\uAC00 \uBC1C\uC0DD\uD588\uC2B5\uB2C8\uB2E4."),
                React.createElement("p", { style: { color: '#374151' } }, "\uD654\uBA74\uC774 \uC0AC\uB77C\uC9C0\uC9C0 \uC54A\uB3C4\uB85D \uC624\uB958 \uBCF4\uD638 \uC7A5\uCE58\uB97C \uCD94\uAC00\uD588\uC2B5\uB2C8\uB2E4. \uC544\uB798 \uBA54\uC2DC\uC9C0\uB97C \uD655\uC778\uD574 \uC8FC\uC138\uC694."),
                React.createElement("pre", { style: { whiteSpace: 'pre-wrap', background: '#fef2f2', padding: '12px', borderRadius: '8px', color: '#7f1d1d' } }, String(this.state.error && (this.state.error.message || this.state.error))),
                React.createElement("p", { style: { fontSize: '13px', color: '#6b7280' } }, "\uB300\uBD80\uBD84 CDN \uB77C\uC774\uBE0C\uB7EC\uB9AC \uB85C\uB529 \uC2E4\uD328 \uB610\uB294 \uCC28\uD2B8 \uB80C\uB354\uB9C1 \uC624\uB958\uC785\uB2C8\uB2E4. \uC778\uD130\uB137 \uC5F0\uACB0\uC774 \uCC28\uB2E8\uB41C \uD658\uACBD\uC5D0\uC11C\uB294 \uADF8\uB798\uD504\uC640 docx \uB2E4\uC6B4\uB85C\uB4DC \uAE30\uB2A5\uC774 \uC81C\uD55C\uB420 \uC218 \uC788\uC2B5\uB2C8\uB2E4.")));
        }
        return this.props.children;
    }
}
// Mount
const rootEl = document.getElementById('root');
try {
    if (!window.React || !window.ReactDOM) {
        throw new Error('React 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 CDN 차단 여부를 확인하세요.');
    }
    const root = ReactDOM.createRoot(rootEl);
    root.render(React.createElement(ErrorBoundary, null,
        React.createElement(TopApp, null)));
}
catch (err) {
    console.error('초기 실행 오류:', err);
    rootEl.innerHTML = `
    <div style="max-width:760px;margin:60px auto;padding:28px;background:#fff;border:1px solid #fecaca;border-radius:12px;font-family:Malgun Gothic,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,0.08)">
      <h2 style="margin-top:0;color:#b91c1c">웹앱 초기 실행 실패</h2>
      <p style="color:#374151">필수 라이브러리를 불러오지 못했거나 초기 스크립트 오류가 발생했습니다.</p>
      <pre style="white-space:pre-wrap;background:#fef2f2;padding:12px;border-radius:8px;color:#7f1d1d">${String(err && (err.message || err))}</pre>
    </div>`;
}

</script>
